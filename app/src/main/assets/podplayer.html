<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Podcasts</title>
<style>
  /* Designed for the waveguide: black is transparent on the glasses, so the
     page floats; panels get a whisper of fill and a thin border, the same
     language as the HUD. Everything is sized for a 320px CSS layout. */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:#000; }
  body {
    font-family: system-ui, sans-serif; color:#fff; background:#000;
    padding-bottom:64px; /* room for the player bar */
  }
  #bar {
    position:sticky; top:0; z-index:5; display:flex; gap:6px;
    padding:8px; background:#000;
  }
  #q {
    flex:1; min-width:0; background:#101418; color:#fff;
    border:1px solid #375; border:1px solid #46606a; border-radius:6px;
    padding:8px 10px; font-size:15px;
  }
  #q::placeholder { color:#8aa; }
  #go {
    background:#123; color:#7FDBFF; border:1px solid #7FDBFF; border-radius:6px;
    padding:8px 14px; font-size:15px; font-weight:600;
  }
  #status { padding:2px 10px 6px; font-size:13px; color:#8aa; min-height:18px; }
  /* Podcast grid: three tiles across at 320. */
  #grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:0 8px; }
  .tile { border:1px solid #2a3a42; border-radius:8px; overflow:hidden; background:#0b0f12; }
  .tile img { width:100%; aspect-ratio:1; display:block; background:#111; }
  .tile .t {
    font-size:11.5px; line-height:1.25; padding:4px 5px 6px; color:#dfe;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    min-height:33px;
  }
  /* Episode list */
  #eps { display:none; }
  #ephead { display:flex; align-items:center; gap:8px; padding:4px 8px 8px; }
  #ephead img { width:44px; height:44px; border-radius:6px; border:1px solid #2a3a42; }
  #ephead .n { font-size:14px; font-weight:600; color:#fff; }
  #back {
    background:#123; color:#7FDBFF; border:1px solid #46606a; border-radius:6px;
    padding:6px 10px; font-size:13px; margin:0 8px 8px;
  }
  .ep { padding:7px 10px; border-top:1px solid #1b262c; }
  .ep .n { font-size:13.5px; line-height:1.3; color:#fff; }
  .ep .d { font-size:11.5px; color:#8aa; margin-top:2px; }
  .ep.playing { background:#0e1a20; border-left:3px solid #7FDBFF; }
  .ep.playing .n { color:#7FDBFF; }
  /* Player bar: thin, fixed, and under the unpin threshold by design. */
  #player {
    position:fixed; left:0; right:0; bottom:0; z-index:6;
    background:#0b0f12; border-top:1px solid #2a3a42; padding:5px 8px 7px;
    display:none;
  }
  #ptitle {
    font-size:12px; color:#dfe; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-bottom:4px;
  }
  #controls { display:flex; align-items:center; gap:8px; }
  #controls button {
    background:#123; color:#fff; border:1px solid #46606a; border-radius:6px;
    font-size:14px; padding:5px 0; width:52px;
  }
  #play { color:#7FDBFF; border-color:#7FDBFF; font-weight:700; }
  #seek { flex:1; height:4px; background:#1b262c; border-radius:2px; position:relative; }
  #fill { height:100%; width:0%; background:#7FDBFF; border-radius:2px; }
  #time { font-size:11px; color:#8aa; min-width:74px; text-align:right; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>

<form id="bar" onsubmit="return doSearch()">
  <input id="q" type="search" placeholder="Search podcasts" autocomplete="off">
  <button id="go" type="submit">Go</button>
</form>
<div id="status"></div>
<div id="grid"></div>

<div id="eps">
  <div id="ephead"><img id="epart" alt=""><div class="n" id="epname"></div></div>
  <button id="back" onclick="showGrid()">‹ Back to results</button>
  <div id="eplist"></div>
</div>

<div id="player">
  <div id="ptitle"></div>
  <div id="controls">
    <button onclick="skip(-15)">−15</button>
    <button id="play" onclick="toggle()">▶</button>
    <button onclick="skip(30)">+30</button>
    <div id="seek" onclick="scrub(event)"><div id="fill"></div></div>
    <div id="time">0:00</div>
  </div>
</div>

<audio id="au"></audio>

<script>
/* Tell the host which strips of this window are CHROME: resting the cursor
   on the search bar or the player bar means "about to click", so the edge
   bands must not scroll the list underneath. CSS px; the host scales.
   The bottom inset TRACKS the playbar — declared only while the bar
   exists, because a dead band over plain list content is exactly the bug
   this feature was built to remove. */
function declareInsets(){
  var barShown = document.getElementById('player').style.display === 'block';
  var b = barShown ? 62 : 0;
  window.__x3EdgeInsets = { top: 44, bottom: b };
  try {
    if (window.X3Input && X3Input.onEdgeInsets) X3Input.onEdgeInsets(44, b);
  } catch (e) {}
}
declareInsets();

/* JSONP against the iTunes Search API: keyless, and a <script> tag is not
   subject to CORS, so this works from any origin including ours. */
var _cb = 0;
function jsonp(url, ok, fail) {
  var name = '__pp' + (++_cb);
  var s = document.createElement('script');
  var t = setTimeout(function(){ cleanup(); fail('timed out'); }, 12000);
  function cleanup(){ clearTimeout(t); delete window[name]; s.remove(); }
  window[name] = function(d){ cleanup(); ok(d); };
  s.onerror = function(){ cleanup(); fail('network error'); };
  s.src = url + '&callback=' + name;
  document.head.appendChild(s);
}
function esc(s){ var d=document.createElement('span'); d.textContent=s||''; return d.innerHTML; }
function status(m){ document.getElementById('status').textContent = m || ''; }

var results = [];
function doSearch(){
  var q = document.getElementById('q').value.trim();
  if (!q) return false;
  status('Searching…');
  showGrid();
  jsonp('https://itunes.apple.com/search?media=podcast&limit=24&term=' + encodeURIComponent(q),
    function(d){
      results = d.results || [];
      var g = document.getElementById('grid');
      g.innerHTML = results.map(function(r, i){
        return '<div class="tile" onclick="openPod(' + i + ')">' +
          '<img loading="lazy" src="' + esc(r.artworkUrl100 || '') + '" alt="">' +
          '<div class="t">' + esc(r.collectionName) + '</div></div>';
      }).join('');
      status(results.length ? results.length + ' podcasts' : 'Nothing found for "' + q + '"');
    },
    function(e){ status('Search failed: ' + e); });
  return false; /* stop the form navigating */
}

var episodes = [];
var playingIdx = -1;
function openPod(i){
  var p = results[i];
  if (!p) return;
  status('Loading episodes…');
  jsonp('https://itunes.apple.com/lookup?media=podcast&entity=podcastEpisode&limit=30&id=' + p.collectionId,
    function(d){
      /* First result is the podcast itself; the rest are episodes. */
      episodes = (d.results || []).filter(function(r){
        return r.wrapperType === 'podcastEpisode' && r.episodeUrl;
      });
      document.getElementById('epart').src = p.artworkUrl100 || '';
      document.getElementById('epname').textContent = p.collectionName;
      document.getElementById('eplist').innerHTML = episodes.map(function(e, j){
        var when = (e.releaseDate || '').slice(0, 10);
        var dur = e.trackTimeMillis ? fmt(e.trackTimeMillis / 1000) : '';
        return '<div class="ep" id="ep' + j + '" onclick="playEp(' + j + ')">' +
          '<div class="n">' + esc(e.trackName) + '</div>' +
          '<div class="d">' + when + (dur ? ' · ' + dur : '') + '</div></div>';
      }).join('');
      document.getElementById('grid').style.display = 'none';
      document.getElementById('eps').style.display = 'block';
      status(episodes.length + ' episodes');
    },
    function(e){ status('Could not load episodes: ' + e); });
}
function showGrid(){
  document.getElementById('eps').style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
}

var au = document.getElementById('au');
function playEp(j){
  var e = episodes[j];
  if (!e) return;
  var old = document.querySelector('.ep.playing');
  if (old) old.classList.remove('playing');
  var row = document.getElementById('ep' + j);
  if (row) row.classList.add('playing');
  playingIdx = j;
  au.src = e.episodeUrl;
  au.play();
  document.getElementById('ptitle').textContent = e.trackName;
  document.getElementById('player').style.display = 'block';
  declareInsets(); /* the bar now exists — claim its strip from the band */
}
function toggle(){ if (au.paused) au.play(); else au.pause(); }
function skip(s){ try { au.currentTime = Math.max(0, au.currentTime + s); } catch(e){} }
function scrub(ev){
  if (!au.duration) return;
  var r = document.getElementById('seek').getBoundingClientRect();
  au.currentTime = au.duration * (ev.clientX - r.left) / r.width;
}
function fmt(s){
  s = Math.floor(s);
  var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
}
au.addEventListener('play',  function(){ document.getElementById('play').textContent = '⏸'; });
au.addEventListener('pause', function(){ document.getElementById('play').textContent = '▶'; });
au.addEventListener('timeupdate', function(){
  if (!au.duration) return;
  document.getElementById('fill').style.width = (au.currentTime / au.duration * 100) + '%';
  document.getElementById('time').textContent = fmt(au.currentTime) + ' / ' + fmt(au.duration);
});
/* A finished episode rolls into the next one — a player, not a dead end. */
au.addEventListener('ended', function(){
  if (playingIdx >= 0 && playingIdx + 1 < episodes.length) playEp(playingIdx + 1);
});

/* ?q= makes the page directly addressable by voice: "open jazz on
   podcasts" arrives here with the search already made. */
var q0 = new URLSearchParams(location.search).get('q');
if (q0) { document.getElementById('q').value = q0; doSearch(); }
else { status('Say or type what to listen to.'); }
</script>
</body>
</html>
